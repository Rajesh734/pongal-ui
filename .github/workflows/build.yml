name: Build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/rajesh734/pongal-ui/community-site

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          cp -r secrets.example secrets
          export IMAGE_TAG=ci APP_ENV=non-prod HOST_PORT=3101
          export DATABASE_NAME=samugam_nonprod DATABASE_USER=samugam_nonprod_app APP_BASE_URL=https://ci.example.org
          docker compose config --quiet
          bad=$(docker compose config --format json | jq -r '.services[].ports[]?.host_ip // "0.0.0.0"' | grep -vx '127.0.0.1' || true)
          if [ -n "$bad" ]; then echo "compose.yaml must publish ports on 127.0.0.1 only"; exit 1; fi

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image runs as uid 1000
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE:sha-${GITHUB_SHA::7}" -u)
          echo "uid=$uid"
          test "$uid" = "1000"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push --all-tags "$IMAGE"
          tag="sha-${GITHUB_SHA::7}"
          echo "## Deployable image" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "\`IMAGE_REF=$IMAGE:$tag\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`image_tag=$tag\`" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Copy the image reference for inspection or use the image tag as the manual Deploy workflow input." >> "$GITHUB_STEP_SUMMARY"
