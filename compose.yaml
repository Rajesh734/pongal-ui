# Secrets come from files in ./secrets (never from .env) so they stay out of `docker inspect`.
# Non-secret values and APP_ENV come from .env next to this file; IMAGE_TAG is set by scripts/nas-deploy.sh.
name: community-site-${APP_ENV:?set APP_ENV in .env}

services:
  community-site:
    image: ghcr.io/rajesh734/pongal-ui/community-site:${IMAGE_TAG:?set IMAGE_TAG}
    container_name: community-site-${APP_ENV}
    restart: unless-stopped
    # Loopback only: the host-networked cloudflared reaches it via localhost; LAN clients cannot.
    ports:
      - "127.0.0.1:${HOST_PORT:?set HOST_PORT in .env}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_DRIVER: postgres
      DATABASE_HOST: ${DATABASE_HOST:-kalanjiyam}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:?set DATABASE_NAME in .env}
      DATABASE_USER: ${DATABASE_USER:?set DATABASE_USER in .env}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      QR_PASS_ENCRYPTION_KEY_FILE: /run/secrets/qr_pass_encryption_key
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      EDIT_TOKEN_KEY_FILE: /run/secrets/edit_token_key
      TURNSTILE_SECRET_FILE: /run/secrets/turnstile_secret
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
    volumes:
      # Retain old PGlite data until its migration/retention decision is complete.
      - ./data:/data
    secrets:
      - database_password
      - qr_pass_encryption_key
      - edit_token_key
      - turnstile_secret
      - smtp_pass
    networks:
      - default
      - kalanjiyam-net

secrets:
  database_password:
    file: ./secrets/database_password
  qr_pass_encryption_key:
    file: ./secrets/qr_pass_encryption_key
  edit_token_key:
    file: ./secrets/edit_token_key
  turnstile_secret:
    file: ./secrets/turnstile_secret
  smtp_pass:
    file: ./secrets/smtp_pass

networks:
  default: {}
  kalanjiyam-net:
    external: true
    name: kalanjiyam-net
